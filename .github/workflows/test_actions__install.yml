name: Test actions/install

on:
  workflow_dispatch: # Allows you to run this workflow manually from the Actions tab
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  default:
    runs-on: ubuntu-latest
    steps:
      # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
      - uses: percebus/github-actions-common/.github/actions/checkout@main

      # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
      - uses: percebus/github-actions-python/.github/actions/setup@main

      # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
      - uses: percebus/github-actions-pip/.github/actions/install-upgrade@main

      - uses: ./.github/actions/install

      # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
      - uses: percebus/github-actions-pip/.github/actions/freeze@main

  python__matrix:
    needs: default
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"

    name: python @ ${{ matrix.python-version }}
    steps:
      # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
      - uses: percebus/github-actions-common/.github/actions/checkout@main

      # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
      - uses: percebus/github-actions-python/.github/actions/setup@main
        with:
          python-version: ${{ matrix.python-version }}

      # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
      - uses: percebus/github-actions-pip/.github/actions/install-upgrade@main

      - uses: ./.github/actions/install

      # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
      - uses: percebus/github-actions-pip/.github/actions/freeze@main

  requirements-file__matrix:
    needs: default
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        example:
          - pypyr
          - poetry
          - pip-audit
          - uv

    name: "-r ${{ matrix.example }}/requirements.pipx.txt"
    steps:
      # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
      - uses: percebus/github-actions-common/.github/actions/checkout@main

      # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
      - uses: percebus/github-actions-python/.github/actions/setup@main

      # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
      - uses: percebus/github-actions-pip/.github/actions/install-upgrade@main

      - uses: ./.github/actions/install
        with:
          requirements-file: ./assets/examples/${{ matrix.example }}/requirements.pipx.txt

      # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
      - uses: percebus/github-actions-pip/.github/actions/freeze@main

      - name: pipx run
        run: pipx run -- ${{ matrix.example }} --help
