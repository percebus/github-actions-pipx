name: pipx run pip-audit

on:
  workflow_dispatch: # Allows you to run this workflow manually from the Actions tab
    inputs:
      # github-actions-common/.../checkout
      ssh-private-key:
        type: string
        description: SSH private key
        required: false

      #
      # github-actions-python/.../setup
      python-version-file:
        type: string
        description: Python version to install
        required: false
        default: "" # auto-detect

      python-version:
        type: string
        description: Python version to install
        required: false
        default: ""

      architecture:
        type: string
        description: Architecture to install python
        required: false
        default: x64
      # NOTE: ^^^ github-actions-python/.../setup

      #
      # NOTE: vvv github-actions-pip/.../install-upgrade
      pip_cli_options:
        type: string
        description: Options to pass to the pip command
        required: false
        default: "--verbose"

      upgrade-requirements-file:
        type: string
        description: Path to the requirements file
        required: false
        default: ./requirements.upgrade.txt
      # NOTE: ^^^ github-actions-pip/.../install-upgrade

      #
      # NOTE: vvv run_pip-audit
      project_path:
        type: string
        description: Path to the requirements file
        required: false
        default: .

      pip-audit_cli_arguments:
        type: string
        description: Options to pass to the pip-audit command
        required: false
        default: "--locked"

      continue-on-error:
        type: boolean
        description: Continue on error
        required: false
        default: true
      # NOTE: ^^^ run_pip-audit

  workflow_call: # SRC: https://docs.github.com/en/actions/using-workflows/reusing-workflows
    inputs:
      # github-actions-common/.../checkout
      ssh-private-key:
        type: string
        description: SSH private key
        required: false

      #
      # NOTE: vvv github-actions-python/.../setup
      python-version-file:
        type: string
        description: Python version to install
        required: false
        default: "" # auto-detect

      python-version:
        type: string
        description: Python version to install
        required: false
        default: ""

      architecture:
        type: string
        description: Architecture to install python
        required: false
        default: x64
      # NOTE: ^^^ github-actions-python/.../setup

      #
      # NOTE: vvv github-actions-pip/.../install-upgrade
      pip_cli_options:
        type: string
        description: Options to pass to the pip command
        required: false
        default: "--verbose"

      upgrade-requirements-file:
        type: string
        description: Path to the requirements file
        required: false
        default: ./requirements.upgrade.txt
      # NOTE: ^^^ github-actions-pip/.../install-upgrade

      #
      # NOTE: vvv run_pip-audit
      project_path:
        type: string
        description: Path to the requirements file
        required: false
        default: .

      pip-audit_cli_arguments:
        type: string
        description: Options to pass to the pip-audit command
        required: false
        default: "--locked"

      continue-on-error:
        type: boolean
        description: Continue on error
        required: false
        default: true
      # NOTE: ^^^ run_pip-audit

permissions:
  contents: read

jobs:
  pip-audit:
    name: run pip-audit
    runs-on: ubuntu-latest
    steps:
      # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
      - uses: percebus/github-actions-common/.github/actions/checkout@main
        with:
          ssh-private-key: ${{ inputs.ssh-private-key }}

      # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
      - uses: percebus/github-actions-python/.github/actions/setup@main
        with:
          python-version-file: ${{ inputs.python-version-file }}
          python-version: ${{ inputs.python-version }}
          architecture: ${{ inputs.architecture }}

      # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
      - uses: percebus/github-actions-pip/.github/actions/install-upgrade@main
        with:
          pip_cli_options: ${{ inputs.pip_cli_options }}
          requirements-file: ${{ inputs.upgrade-requirements-file }}

      # TODO? use gh-action-pip-audit? SEE: https://github.com/pypa/gh-action-pip-audit
      # nosemgrep: yaml.github-actions.security.run-shell-injection.run-shell-injection # FIXME
      - run: pipx run -- pip-audit ${{ inputs.project_path }} ${{ inputs.pip-audit_cli_arguments }}
        name: pip-audit
        continue-on-error: ${{ inputs.continue-on-error }}
